<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Szavazás</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Szavazási Platform</h1>
    </header>
	
	<div style="background: #eee; padding: 10px; margin-bottom: 20px; text-align: center;">
        <button onclick="alert('Admin felület megnyitása...')">Admin belépés</button>
        <button onclick="fetch('/api/user/history/1').then(r=>r.json()).then(d=>alert('Eddigi szavazataid: ' + JSON.stringify(d)))">Saját történetem</button>
    </div>
	
	<div class="admin-panel">
		<input type="text" id="uj-kerdes" placeholder="Új szavazás kérdése...">
		<input type="text" id="uj-opciok" placeholder="Opciók (vesszővel elválasztva: Alma, Körte, Barack)">
		<button onclick="ujSzavazas()">Hozzáadás</button>
	</div>

    <main class="container">
        <section id="aktiv-szavazasok">
            <h2>Aktív szavazások</h2>
            <div id="szavazas-lista">
                <!-- JavaScript tölti fel -->
                <p>Betöltés...</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Projektfeladat - Webprogramozás alapjai</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
